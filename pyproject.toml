[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monterey-canyon-mbes"
version = "0.1.0"
description = "Monterey Canyon MBES analysis: sector-angle backscatter tables and related processing"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Jeff Beeson"}
]
keywords = ["multibeam", "kongsberg", "kmall", "backscatter", "monterey-canyon", "oceanography"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mbes-tools",
    "python-dotenv",
    "numpy",
    "scipy",
    "pyproj",
    "pandas",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/Jeff-Beeson/Monterey_Canyon_MBES"

[tool.setuptools.packages.find]
where = ["src"]
